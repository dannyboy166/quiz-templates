{% extends "base.html" %}
{% block title %}Images — QuestionReview{% endblock %}
{% block content %}
<div class="image-list-page question-list-page">
    <div class="list-header">
        <h1>Image Generation</h1>
        <div class="list-actions">
            <button class="btn btn-primary" id="bulk-gen-btn" onclick="bulkGenerateImages()" disabled>
                Generate Selected
            </button>
            <button class="btn btn-secondary" id="sync-btn" onclick="syncAirtable()" title="Sync with Airtable to see images done outside this app">
                Sync
            </button>
            <label class="select-all-label">
                <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)">
                Select visible
            </label>
        </div>
    </div>

    <div class="filter-bar">
        <select id="filter-subject" onchange="applyFilters()">
            <option value="">All Subjects</option>
            {% for s in subjects %}
            <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>
        <select id="filter-topic" onchange="applyFilters()">
            <option value="">All Topics</option>
        </select>
        <select id="filter-sheet" onchange="applyFilters()">
            <option value="">All Sheets</option>
        </select>
        <select id="filter-status" onchange="applyFilters()">
            <option value="no_image">Needs Image</option>
            <option value="">All Questions</option>
            <option value="in_airtable">Done (in Airtable)</option>
            <option value="generated">AI Generated</option>
            <option value="img_required">Image Required (Y)</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search question text or description..."
               oninput="applyFilters()">
        <span class="filter-count" id="filter-count"></span>
    </div>

    <div id="canva-status-banner"></div>
    <div class="progress-summary" id="progress-summary" style="margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted);"></div>

    <div class="detail-card" style="margin-bottom: 1rem; padding: 1rem;">
        <label style="font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 0.4rem;">
            Default Prompt Template
            <span style="font-weight: 400; color: var(--text-muted);"> — used when no custom prompt is typed. Use {question} for the question text.</span>
        </label>
        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="default-prompt-template"
                   value="Create a graphic of this scenario: {question}. No writing in the graphic."
                   style="flex: 1; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
            <select id="image-size" style="padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
                <option value="1024x1024">Square</option>
                <option value="1536x1024" selected>Landscape</option>
                <option value="1024x1536">Portrait</option>
                <option value="auto">Auto</option>
            </select>
        </div>
    </div>

    <div class="question-table-wrap">
        <table class="question-table">
            <thead>
                <tr>
                    <th class="col-check"><input type="checkbox" id="header-check" onchange="toggleSelectAll(this.checked)"></th>
                    <th class="col-id">ItemID</th>
                    <th class="col-text">Question</th>
                    <th style="min-width:180px;">Prompt</th>
                    <th class="col-img-status">Image</th>
                    <th class="col-actions">Actions</th>
                </tr>
            </thead>
            <tbody id="question-tbody"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>

    <!-- Image preview modal -->
    <div class="modal-overlay" id="preview-modal" style="display:none;" onclick="if(event.target===this)hidePreview()">
        <div class="modal-content" style="max-width:600px;text-align:center;">
            <h3 style="margin-bottom:0.5rem;"><span id="preview-id"></span></h3>
            <p id="preview-question" style="font-size:0.9rem;color:var(--text-muted);margin:0 0 0.5rem 0;text-align:left;"></p>
            <img id="preview-img" src="" style="max-width:100%;border-radius:8px;margin:0.5rem 0;border:2px solid #ddd;">

            <!-- Edit section -->
            <div style="margin:0.75rem 0;padding:0.75rem;background:#f0f7ff;border-radius:8px;border:1px solid #cce0ff;text-align:left;">
                <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">
                    Quick Edit <span style="font-weight:400;color:var(--text-muted);">— tweak without regenerating</span>
                </label>
                <div style="display:flex;gap:6px;">
                    <input type="text" id="preview-edit-instruction" placeholder='e.g. "remove the text", "white background"'
                           style="flex:1;padding:6px 10px;border:1px solid #cce0ff;border-radius:6px;font-size:0.85rem;">
                    <button class="btn btn-primary" id="preview-edit-btn" onclick="previewEdit()" style="white-space:nowrap;font-size:0.85rem;">
                        Edit
                    </button>
                </div>
            </div>

            <div class="modal-actions" style="justify-content:center;gap:0.75rem;">
                <button class="btn btn-success" id="preview-approve-btn" onclick="previewApprove()">Approve &amp; Send to Canva</button>
                <button class="btn btn-secondary" onclick="hidePreview()">Close</button>
            </div>
        </div>
    </div>

    <div class="bulk-progress" id="bulk-progress" style="display:none;">
        <div class="progress-bar-outer">
            <div class="progress-bar-inner" id="bulk-progress-bar" style="width:0%"></div>
        </div>
        <span id="bulk-progress-text">0 / 0</span>
    </div>
</div>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="{{ url_for('static', filename='images.css') }}">
<script src="{{ url_for('static', filename='images.js') }}"></script>
<script>
    const ALL_QUESTIONS = {{ questions_json|safe }};
    const TOPICS_BY_SUBJECT = {{ topics_by_subject|safe }};
    const PER_PAGE = 50;
    let filtered = ALL_QUESTIONS;
    let currentPage = 1;
    let selected = new Set();

    // Prompt cache — survives re-renders, debounce-saved to backend
    const promptCache = {};
    const saveTimers = {};

    // Track items currently being edited (shows spinner on thumbnail)
    const editingItems = new Set();

    // Initialize prompt cache from backend-saved prompts
    ALL_QUESTIONS.forEach(q => {
        if (q.saved_prompt) promptCache[q.id] = q.saved_prompt;
    });

    // Build sheet dropdown from data
    const sheetsSet = [...new Set(ALL_QUESTIONS.map(q => q.sheet).filter(Boolean))];
    const sheetSelect = document.getElementById('filter-sheet');
    sheetsSet.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sheetSelect.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('subject')) document.getElementById('filter-subject').value = params.get('subject');
    if (params.get('sheet')) document.getElementById('filter-sheet').value = params.get('sheet');
    if (params.has('status')) document.getElementById('filter-status').value = params.get('status');
    if (params.get('topic')) {
        // Topic dropdown gets populated in applyFilters, so set it after
        setTimeout(() => {
            const topicEl = document.getElementById('filter-topic');
            if (topicEl) topicEl.value = params.get('topic');
            applyFilters();
        }, 0);
    }
    if (params.get('search')) document.getElementById('filter-search').value = params.get('search');
    if (params.get('page')) currentPage = parseInt(params.get('page')) || 1;
    if (params.get('size')) document.getElementById('image-size').value = params.get('size');

    applyFilters();

    // Check Canva connection status
    fetch('/api/canva/status').then(r => r.json()).then(data => {
        const banner = document.getElementById('canva-status-banner');
        if (data.connected) {
            banner.innerHTML = '<div style="background:#efe;border:1px solid #cfc;padding:8px 14px;border-radius:6px;margin-bottom:1rem;font-size:0.9rem;">Canva connected — approved images auto-upload to Canva</div>';
        } else {
            banner.innerHTML = '<div style="background:#fff3cd;border:1px solid #ffc107;padding:8px 14px;border-radius:6px;margin-bottom:1rem;font-size:0.9rem;">Canva not connected — <a href="/canva/auth">click here to connect</a> so approved images upload automatically</div>';
        }
    }).catch(() => {});

    function applyFilters() {
        const subject = document.getElementById('filter-subject').value;
        const topic = document.getElementById('filter-topic').value;
        const sheet = document.getElementById('filter-sheet').value;
        const status = document.getElementById('filter-status').value;
        const search = document.getElementById('filter-search').value.toLowerCase().trim();
        const imgSize = document.getElementById('image-size')?.value || '';

        // Save filters to URL so refresh preserves them
        const p = new URLSearchParams();
        if (subject) p.set('subject', subject);
        if (topic) p.set('topic', topic);
        if (sheet) p.set('sheet', sheet);
        if (status) p.set('status', status);
        if (search) p.set('search', search);
        if (imgSize && imgSize !== '1024x1024') p.set('size', imgSize);
        const newUrl = p.toString() ? `?${p}` : window.location.pathname;
        history.replaceState(null, '', newUrl);

        // Update topic dropdown
        const topicSelect = document.getElementById('filter-topic');
        const currentTopic = topicSelect.value;
        topicSelect.innerHTML = '<option value="">All Topics</option>';
        if (subject && TOPICS_BY_SUBJECT[subject]) {
            TOPICS_BY_SUBJECT[subject].forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                if (t === currentTopic) opt.selected = true;
                topicSelect.appendChild(opt);
            });
        }

        filtered = ALL_QUESTIONS.filter(q => {
            if (subject && q.subject !== subject) return false;
            if (topic && q.topic !== topic) return false;
            if (sheet && q.sheet !== sheet) return false;
            if (status === 'no_image' && q.has_at_image) return false;
            else if (status === 'in_airtable' && !q.has_at_image) return false;
            else if (status === 'generated' && !q.has_gen_image) return false;
            else if (status === 'img_required' && q.img_req !== 'Y') return false;
            if (search && !q.text.toLowerCase().includes(search)
                && !q.id.includes(search)
                && !(q.desc || '').toLowerCase().includes(search)) return false;
            return true;
        });

        // Always maintain spreadsheet order
        filtered.sort((a, b) => a.idx - b.idx);

        currentPage = 1;
        renderTable();

        // Progress summary
        const totalInFilter = filtered.length;
        const doneInFilter = filtered.filter(q => q.has_at_image).length;
        const needsInFilter = totalInFilter - doneInFilter;
        const pct = totalInFilter > 0 ? Math.round(doneInFilter / totalInFilter * 100) : 0;
        document.getElementById('filter-count').textContent = `${filtered.length} questions`;
        document.getElementById('progress-summary').innerHTML =
            `<strong>${doneInFilter}</strong> / ${totalInFilter} done (${pct}%) &mdash; ` +
            `<strong>${needsInFilter}</strong> still need images`;
    }

    function renderTable() {
        const start = (currentPage - 1) * PER_PAGE;
        const page = filtered.slice(start, start + PER_PAGE);
        const tbody = document.getElementById('question-tbody');

        // Capture typed prompts before re-render
        tbody.querySelectorAll('.list-prompt-input').forEach(input => {
            const id = input.id.replace('prompt-', '');
            if (input.value.trim()) promptCache[id] = input.value;
        });

        tbody.innerHTML = page.map(q => {
            const promptVal = promptCache[q.id] || q.saved_prompt || '';
            return `
            <tr class="question-row ${q.has_at_image ? 'approved' : ''}">
                <td class="col-check">
                    <input type="checkbox" ${selected.has(q.id) ? 'checked' : ''}
                           onchange="toggleSelect('${q.id}', this.checked)">
                </td>
                <td class="col-id"><a href="/images/${q.id}" style="color:inherit;text-decoration:none;font-weight:600;">${q.id}</a></td>
                <td class="col-text">${escapeHtml(q.text)}</td>
                <td>
                    <input type="text" class="list-prompt-input" id="prompt-${q.id}"
                           placeholder="Type what image you need..."
                           value="${escapeHtml(promptVal)}"
                           style="width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:0.8rem;">
                </td>
                <td class="col-img-status" style="text-align:center;">
                    ${editingItems.has(q.id) ? '<div style="width:80px;height:80px;display:inline-flex;align-items:center;justify-content:center;border:2px dashed #4CAF50;border-radius:4px;"><span class="spinner" style="width:24px;height:24px;"></span></div>'
                      : q.has_at_image ? '<span class="status-icon approved" title="In Airtable">&#10003;</span>'
                      : q.has_gen_image ? `<img src="/generated-images/${q.id}-question.png?t=${Date.now()}"
                           class="list-thumb" onclick="showPreview('${q.id}')"
                           title="Click to preview" style="width:80px;height:80px;border-radius:4px;object-fit:cover;cursor:pointer;border:1px solid #ddd;">`
                      : '<span class="status-icon pending">&mdash;</span>'}
                </td>
                <td class="col-actions" style="white-space:nowrap;">
                    ${q.has_gen_image && !q.has_at_image && q.img_status !== 'approved' ? `
                        <button class="action-btn approve-btn" onclick="quickApproveImage('${q.id}')" title="Approve & send to Canva">&#10003;</button>
                        <button class="action-btn" onclick="regenerateImage('${q.id}')" title="Regenerate with prompt" style="font-size:0.8rem;">&#8635;</button>
                    ` : q.img_status === 'approved' && q.has_gen_image ? `
                        <span class="done-label">Sent</span>
                        <button class="action-btn" onclick="resendToCanva('${q.id}')" title="Resend to Canva" style="font-size:0.7rem;">&#8635;</button>
                    ` : q.has_at_image ? '<span class="done-label">Done</span>'
                      : !q.has_gen_image && !editingItems.has(q.id) ? `
                        <button class="action-btn" onclick="regenerateImage('${q.id}')" title="Generate image" style="font-size:0.8rem;">&#9654;</button>
                    ` : ''}
                </td>
            </tr>`;
        }).join('');

        renderPagination();
        updateBulkButton();
    }

    // Debounced auto-save prompts to backend
    document.getElementById('question-tbody').addEventListener('input', e => {
        if (e.target.classList.contains('list-prompt-input')) {
            const id = e.target.id.replace('prompt-', '');
            promptCache[id] = e.target.value;
            clearTimeout(saveTimers[id]);
            saveTimers[id] = setTimeout(() => {
                fetch(`/api/images/save-prompt/${id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image_type: 'question', prompt: e.target.value})
                });
            }, 1500);
        }
    });

    function renderPagination() {
        const totalPages = Math.ceil(filtered.length / PER_PAGE);
        if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
        let html = '';
        if (currentPage > 1) html += `<button onclick="goPage(${currentPage-1})">&laquo; Prev</button>`;
        html += `<span class="page-info">Page ${currentPage} of ${totalPages}</span>`;
        if (currentPage < totalPages) html += `<button onclick="goPage(${currentPage+1})">Next &raquo;</button>`;
        document.getElementById('pagination').innerHTML = html;
    }

    function goPage(n) {
        currentPage = n;
        const p = new URLSearchParams(window.location.search);
        if (n > 1) p.set('page', n); else p.delete('page');
        history.replaceState(null, '', p.toString() ? `?${p}` : window.location.pathname);
        renderTable();
        window.scrollTo(0, 0);
    }
    function toggleSelect(id, checked) { if (checked) selected.add(id); else selected.delete(id); updateBulkButton(); }
    function toggleSelectAll(checked) {
        const start = (currentPage - 1) * PER_PAGE;
        filtered.slice(start, start + PER_PAGE).forEach(q => { if (checked) selected.add(q.id); else selected.delete(q.id); });
        renderTable();
    }
    function updateBulkButton() {
        const btn = document.getElementById('bulk-gen-btn');
        btn.disabled = selected.size === 0;
        btn.textContent = selected.size ? `Generate Selected (${selected.size})` : 'Generate Selected';
    }
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // Preview modal
    function showPreview(itemId) {
        const overlay = document.getElementById('preview-modal');
        const img = document.getElementById('preview-img');
        const idSpan = document.getElementById('preview-id');
        const questionP = document.getElementById('preview-question');
        const editInput = document.getElementById('preview-edit-instruction');

        img.src = `/generated-images/${itemId}-question.png?t=${Date.now()}`;
        idSpan.textContent = itemId;
        overlay.dataset.itemId = itemId;

        // Show full question text + options
        const q = ALL_QUESTIONS.find(q => q.id === itemId);
        if (q) {
            questionP.textContent = q.text;
        }

        // Clear edit input
        if (editInput) editInput.value = '';

        // Reset approve button
        const approveBtn = document.getElementById('preview-approve-btn');
        if (approveBtn) { approveBtn.textContent = 'Approve & Send to Canva'; approveBtn.disabled = false; }

        overlay.style.display = 'flex';
    }

    function hidePreview() {
        document.getElementById('preview-modal').style.display = 'none';
    }

    async function previewEdit() {
        const itemId = document.getElementById('preview-modal').dataset.itemId;
        const editInput = document.getElementById('preview-edit-instruction');
        const instruction = editInput ? editInput.value.trim() : '';
        if (!instruction) {
            alert('Type an edit instruction (e.g. "remove the text")');
            if (editInput) editInput.focus();
            return;
        }

        // Close preview and run edit in background
        hidePreview();
        editingItems.add(itemId);
        renderTable();  // Shows spinner on the thumbnail

        try {
            const size = document.getElementById('image-size')?.value || '1536x1024';
            const res = await fetch(`/api/images/edit/${itemId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: instruction, size: size})
            });
            const data = await res.json();
            editingItems.delete(itemId);
            if (data.ok) {
                const q = ALL_QUESTIONS.find(q => q.id === itemId);
                if (q) { q.has_gen_image = true; q.img_status = 'pending'; q.has_at_image = false; }
            } else {
                alert(`Edit failed for ${itemId}: ` + (data.error || 'Unknown error'));
            }
        } catch (e) {
            editingItems.delete(itemId);
            alert(`Edit failed for ${itemId}: ` + e.message);
        }
        renderTable();
    }

    async function quickApproveImage(itemId) {
        // Show sending state
        const btn = event && event.target ? event.target : null;
        if (btn) { btn.disabled = true; btn.textContent = '...'; }

        try {
            const res = await fetch(`/api/images/approve/${itemId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image_type: 'question'})
            });
            const data = await res.json();
            if (data.ok) {
                const q = ALL_QUESTIONS.find(q => q.id === itemId);
                if (q) {
                    q.img_status = 'approved';
                    q.has_at_image = true;
                }
                if (data.canva_error) {
                    alert('Approved but Canva upload failed: ' + data.canva_error);
                } else if (data.canva_uploaded) {
                    if (btn) { btn.textContent = 'Sent!'; btn.style.background = '#4CAF50'; btn.style.color = 'white'; }
                    setTimeout(() => renderTable(), 800);
                    return;
                }
                renderTable();
            }
        } catch (e) {
            alert('Error: ' + e.message);
            if (btn) { btn.disabled = false; btn.textContent = '✓'; }
        }
    }

    function resolvePrompt(itemId) {
        // Get the prompt for this item — custom prompt, or fall back to default template
        const input = document.getElementById(`prompt-${itemId}`);
        const customPrompt = input ? input.value.trim() : '';
        const q = ALL_QUESTIONS.find(q => q.id === itemId);
        const questionText = q ? q.text : '';

        if (customPrompt) {
            // Replace {question} if present in custom prompt
            return customPrompt.replace('{question}', questionText);
        }

        // Fall back to default template
        const templateEl = document.getElementById('default-prompt-template');
        const template = templateEl ? templateEl.value.trim() : '';
        if (template) {
            return template.replace('{question}', questionText);
        }

        return '';
    }

    async function regenerateImage(itemId) {
        const prompt = resolvePrompt(itemId);
        if (!prompt) {
            const input = document.getElementById(`prompt-${itemId}`);
            alert('Type a prompt or set a default template first');
            if (input) input.focus();
            return;
        }

        // Show generating state
        const input = document.getElementById(`prompt-${itemId}`);
        const row = input ? input.closest('tr') : null;
        const imgCell = row ? row.querySelector('.col-img-status') : null;
        if (imgCell) imgCell.innerHTML = '<span class="spinner" style="display:inline-block;width:20px;height:20px;"></span>';

        try {
            const size = document.getElementById('image-size')?.value || '1024x1024';
            const res = await fetch(`/api/images/generate/${itemId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: prompt, size: size})
            });
            const data = await res.json();
            if (data.ok) {
                const q = ALL_QUESTIONS.find(q => q.id === itemId);
                if (q) {
                    q.has_gen_image = true;
                    q.img_status = 'pending';
                    q.has_at_image = false;
                }
                renderTable();
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
                renderTable();
            }
        } catch (e) {
            alert('Error: ' + e.message);
            renderTable();
        }
    }

    function quickRejectImage(itemId) {
        // Just clear the generated image status so they can regenerate
        const q = ALL_QUESTIONS.find(q => q.id === itemId);
        if (q) q.has_gen_image = false;
        renderTable();
    }

    async function previewApprove() {
        const itemId = document.getElementById('preview-modal').dataset.itemId;
        await quickApproveImage(itemId);
        hidePreview();
    }

    function previewReject() {
        const itemId = document.getElementById('preview-modal').dataset.itemId;
        quickRejectImage(itemId);
        hidePreview();
    }

    async function resendToCanva(itemId) {
        const btn = event && event.target ? event.target : null;
        if (btn) { btn.disabled = true; btn.textContent = '...'; }
        try {
            const res = await fetch(`/api/images/approve/${itemId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image_type: 'question'})
            });
            const data = await res.json();
            if (data.canva_error) {
                alert('Resend failed: ' + data.canva_error);
            } else if (btn) {
                btn.textContent = '✓';
                btn.style.color = '#4CAF50';
            }
        } catch (e) {
            alert('Resend failed: ' + e.message);
        }
        if (btn) { btn.disabled = false; }
    }

    async function syncAirtable() {
        const btn = document.getElementById('sync-btn');
        btn.disabled = true;
        btn.textContent = 'Syncing...';
        try {
            const res = await fetch('/api/images/refresh-airtable', {method: 'POST'});
            const data = await res.json();
            if (data.ok) {
                btn.textContent = `Synced (${data.count})`;
                setTimeout(() => window.location.reload(), 1000);
            } else {
                alert('Sync failed: ' + (data.error || 'Unknown'));
                btn.textContent = 'Sync';
                btn.disabled = false;
            }
        } catch (e) {
            alert('Sync failed: ' + e.message);
            btn.textContent = 'Sync';
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
