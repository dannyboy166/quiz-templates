<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuestionReview{% endblock %}</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
    <style>
        @font-face { font-family: 'Apfel Grotezk'; src: url('/assets/fonts/ApfelGrotezk-Regular.woff2') format('woff2'); font-weight: 400; }
        @font-face { font-family: 'Apfel Grotezk'; src: url('/assets/fonts/ApfelGrotezk-Mittel.woff2') format('woff2'); font-weight: 500; }
        @font-face { font-family: 'Apfel Grotezk'; src: url('/assets/fonts/ApfelGrotezk-Fett.woff2') format('woff2'); font-weight: 700; }
    </style>
</head>
<body>
    <nav class="review-nav">
        <div class="nav-brand">QuestionReview</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/questions" class="nav-link">Questions</a>
            <a href="/library" class="nav-link">Library</a>
            <a href="/images" class="nav-link">Images</a>
            {% if session.get('authed') %}<a href="/logout" class="nav-link nav-logout">Log out</a>{% endif %}
        </div>
        <div class="nav-status" id="bulk-indicator" style="display:none;">
            <span class="spinner"></span>
            <span id="bulk-indicator-text">Generating...</span>
        </div>
        <div class="nav-status" id="image-bulk-indicator" style="display:none;">
            <span class="spinner"></span>
            <span id="image-bulk-indicator-text">Generating images...</span>
        </div>
    </nav>
    <div id="data-source-banner" style="display:none;"></div>
    <main class="review-main">
        {% block content %}{% endblock %}
    </main>
    <script>
    // Data-source banner: loud warning if we're NOT serving live Google Sheets.
    (function () {
        fetch('/api/data-source').then(r => r.json()).then(d => {
            var el = document.getElementById('data-source-banner');
            if (!el) return;
            if (d.mode === 'live') return;  // all good, no banner
            el.style.display = 'block';
            el.style.cssText = 'display:block;background:#c0392b;color:#fff;padding:10px 16px;'
                + 'font-size:0.9rem;font-weight:700;text-align:center;';
            el.innerHTML = '⚠️ Using STALE offline data — live Google Sheets unreachable'
                + (d.error ? ' (' + d.error + ')' : '')
                + '. <a href="#" style="color:#fff;text-decoration:underline;" '
                + 'onclick="reloadFromSheets(event)">Retry live reload</a>';
        }).catch(function () {});
    })();
    function reloadFromSheets(ev) {
        if (ev) ev.preventDefault();
        fetch('/api/reload-questions', {method: 'POST'}).then(r => r.json()).then(d => {
            if (d.ok) { location.reload(); }
            else { alert('Live reload failed: ' + (d.error || 'unknown')); }
        }).catch(e => alert('Live reload failed: ' + e.message));
    }
    </script>
    <script src="{{ url_for('static', filename='review.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
