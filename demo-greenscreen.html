<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Screen - Progress Bar & Help</title>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #00FF00;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Help Button */
    .help-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }

    .btn-help {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn-help lottie-player {
      pointer-events: none;
    }

    /* Progress Bar Container */
    .progress-container {
      position: relative;
      width: 100%;
      height: 24px;
      margin: 40px 0;
    }

    /* Track (background) */
    .progress-track {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 16px;
      background: #3a3a3a;
      border-radius: 8px;
      transform: translateY(-50%);
      overflow: hidden;
    }

    /* Gradient fill */
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5E58F9 0%, #EFA1D5 100%);
      border-radius: 8px;
      transition: width 0.5s ease-out;
    }

    /* Compass container - positions at progress point */
    .compass-container {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      transition: left 0.5s ease-out;
      z-index: 10;
    }

    /* Compass circle */
    .compass {
      width: 44px;
      height: 44px;
      background: white;
      border: 2px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Compass dots */
    .compass-dot {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #333;
      border-radius: 50%;
    }

    .compass-dot.top { top: 3px; left: 50%; transform: translateX(-50%); }
    .compass-dot.bottom { bottom: 3px; left: 50%; transform: translateX(-50%); }
    .compass-dot.left { left: 3px; top: 50%; transform: translateY(-50%); }
    .compass-dot.right { right: 3px; top: 50%; transform: translateY(-50%); }

    /* Kite shapes inside compass */
    .compass-diamond {
      z-index: 5;
      position: relative;
    }

    .compass-diamond svg {
      width: 28px;
      height: 8px;
      display: block;
    }

    /* Help Bar */
    .help-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 60px;
    }

    .help-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 530;
      color: #333;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .help-item:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .help-item-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
    }

    .help-item-line {
      width: 40px;
      height: 2px;
      background: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Help Button -->
    <div class="help-btn-container">
      <button class="btn-help">
        <lottie-player
          id="help-lottie"
          background="transparent"
          speed="1"
          style="width: 28px; height: 28px;"
          loop
          autoplay
        ></lottie-player>
        Help
      </button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="compass-container" id="compass-container">
        <div class="compass">
          <div class="compass-dot top"></div>
          <div class="compass-dot bottom"></div>
          <div class="compass-dot left"></div>
          <div class="compass-dot right"></div>
          <div class="compass-diamond">
            <svg viewBox="0 0 28 8">
              <polygon points="0,4 10,0 14,4 10,8" fill="#EFA1D5" stroke="#333" stroke-width="0.5"/>
              <polygon points="28,4 18,0 14,4 18,8" fill="#5E58F9" stroke="#333" stroke-width="0.5"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Help Bar -->
    <div class="help-bar">
      <div class="help-item">
        <span>Read Aloud</span>
        <span class="help-item-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
        </span>
      </div>
      <span class="help-item-line"></span>
      <div class="help-item">
        <span>Get Help</span>
        <span class="help-item-icon">?</span>
      </div>
      <span class="help-item-line"></span>
      <div class="help-item">
        <span>Get Hint</span>
        <span class="help-item-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
        </span>
      </div>
    </div>
  </div>

  <script>

    const totalQuestions = 8;

    // Rotation state
    let rotation = 0;
    let spinSpeed = 120;
    const slowSpeed = 120;
    const fastSpeed = 720;
    let lastTime = performance.now();
    let slowDownTimer = null;

    // Spin loop
    function spinCompass(currentTime) {
      const delta = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      rotation += spinSpeed * delta;
      rotation %= 360;

      const compassDiamond = document.querySelector('.compass-diamond');
      if (compassDiamond) {
        compassDiamond.style.transform = `rotate(${rotation}deg)`;
      }

      requestAnimationFrame(spinCompass);
    }

    requestAnimationFrame(spinCompass);

      const progressFill = document.getElementById('progress-fill');
      const compassContainer = document.getElementById('compass-container');

      const percentage = (currentQuestion / totalQuestions) * 100;

      if (animate) {
        if (slowDownTimer) clearTimeout(slowDownTimer);
        spinSpeed = backwards ? -fastSpeed : fastSpeed;
        slowDownTimer = setTimeout(() => {
          spinSpeed = slowSpeed;
        }, 500);
      }

      progressFill.style.width = percentage + '%';
      compassContainer.style.left = percentage + '%';
    }

    // Click anywhere to advance progress
    document.body.addEventListener('click', () => {
      currentQuestion++;
      if (currentQuestion > totalQuestions) currentQuestion = 1;
      updateProgress(true);
    });

    updateProgress();

</body>
