[deploy]
startCommand = "python upload_spreadsheets.py && gunicorn run_review:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300"
# Healthcheck must hit an UNAUTHENTICATED, TRIVIAL path. With ACCESS_PASSWORD set,
# "/" redirects to /login (302) which Railway treats as unhealthy. /healthz returns a
# bare "ok" and does NO data work, so a slow/heavy data endpoint can never fail the deploy.
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
